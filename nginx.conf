server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # GIS popup comunica la credencial a esta ventana mediante window.opener.
    # "same-origin" sin esta excepción puede dejar el popup de Google en blanco.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # El sitemap lo genera el backend (dato en vivo — aparece un producto nuevo sin
    # esperar rebuild/deploy del frontend), pero tiene que quedar servido desde este
    # mismo dominio: Google solo acepta URLs de un sitemap si son del mismo host donde
    # vive el archivo, salvo un cross-submit verificado en Search Console.
    # "set" + "resolver" fuerza resolución DNS en tiempo de request (DNS embebido de
    # Docker) en vez de solo al arrancar nginx, para que no falle si el contenedor del
    # backend tarda en estar listo.
    # PENDIENTE: el backend es el mismo servidor multi-tenant que usa Calzacaribe (por eso el
    # Host de acá abajo sigue siendo manzana.calzacaribe.com — solo importa para el ruteo TLS/
    # Traefik hacia el backend, no para resolver el tenant). Pero para que el backend sepa que
    # ESTE sitemap es el de Ampaz Studio (y no el de Calzacaribe u otra tienda), hace falta
    # agregar acá `proxy_set_header X-Forwarded-Host <dominio-real-de-ampaz-studio>;` en cuanto
    # se decida el dominio real de este storefront — el backend (TenantInterceptor) resuelve el
    # tenant de una ruta pública por ese header, con prioridad sobre el Host.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s;
        set $sitemap_backend "https://manzana.calzacaribe.com/api/v1/public/sitemap.xml";
        proxy_pass $sitemap_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host manzana.calzacaribe.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
